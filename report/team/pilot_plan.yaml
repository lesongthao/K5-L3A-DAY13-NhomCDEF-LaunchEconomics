# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
#
# D1 · Baseline 0,70, mục tiêu ban đầu +5 điểm %, alpha hai phía 0,05, power 0,80, ICC 0,02.
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm theo công thức so sánh hai tỉ lệ.
#   b) Theo nhân viên, m = 75: DE = 2,48. Cần làm tròn lên 1.251 × 2,48 = 3.103 yêu cầu mỗi nhóm.
#      Cần 42 nhân viên mỗi nhóm, tổng 84, vượt 40 người hiện có.
#   c) 20 nhân viên mỗi nhóm: n hiệu dụng luôn dưới giới hạn 20 / 0,02 = 1.000, thấp hơn 1.251.
#   d) 6 depot mỗi nhóm: n hiệu dụng luôn dưới giới hạn 6 / 0,02 = 300.
#   e) Với +6 điểm % và mốc đề bài 859 mỗi nhóm: 20m / (0,98 + 0,02m) ≥ 859 cho m ≥ 299.
#      Mỗi nhóm cần 5.980 yêu cầu thực, DE = 6,96, n hiệu dụng ≈ 859,2.
#
# D2 · Tách tác động
#   1. Hai nhóm chạy cùng thời gian trên cùng phạm vi và có nhân viên ở cùng depot.
#   2. Phân ngẫu nhiên 40 nhân viên, cân bằng theo depot, với seed cố định trước ngày chạy.
#   3. Giảm lan truyền gợi ý bằng quyền theo tài khoản, không chuyển gợi ý sang đối chứng và kiểm tra log theo staff_id.
#   4. Chốt chỉ số, ngưỡng và ngày quyết định trước khi chạy. Kiểm định có tính đến cụm nhân viên.
#   5. Có 20 cụm mỗi nhóm nếu bố trí đủ 40 nhân viên trong sáu depot đã chọn.
#
# Đánh đổi cần duyệt: thiết kế theo mốc +6 điểm % của đề. Nếu tác động thật chỉ +5 điểm %,
# power là 0,642 tại n hiệu dụng 859. Kết quả thiếu bằng chứng chưa đủ để mở rộng.
# D1 và tỷ lệ mở lại đã đối chiếu với đầu ra src/lab13.py ở commit ea09874.
# Mở lại hiện tại [simulated]: toàn mẫu 51/1.200 = 4,25%. Trong phạm vi 39/982 = 3,97%.
# Ngưỡng đề xuất: chênh đối chứng từ +2 điểm % hoặc vượt trần 6%.
# Lịch dưới đây là lịch đề xuất cần Giám đốc vận hành xác nhận trước khi khởi động.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: >-
    Chỉ noi_dia và hang_nang tại D01–D06. Chi phí biến đổi mỗi việc thành công
    lần lượt 2.696 đ và 8.221 đ [simulated], so với mức nhân viên tự làm 12.000 đ.
    Loại quoc_te (22.515 đ [simulated]) và doi_tac (10.215 đ [simulated], có điều khoản riêng).
    Mẫu CSV chỉ có 20 nhân viên. Trước khi chạy, xác nhận đủ 40 nhân viên trong phạm vi
    và đủ lưu lượng cho mục tiêu mỗi cụm. Nếu thiếu người hoặc thiếu lưu lượng, trình lại thiết kế trước khi chạy.
  assignment:
    unit: staff
    control_share: 0.5
    randomized: true
    method: "Xáo ngẫu nhiên theo depot bằng seed 1313, cân bằng 20 người mỗi nhóm. Giữ cố định nhóm đã gán."
  rollout: [0.10, 0.25, 0.50] # 4, 10, 20 nhân viên trên tổng 40
  rollout_schedule: >-
    Dự kiến từ 2026-12-07, mỗi bước ít nhất 7 ngày và chỉ tăng bước khi đạt các luật dừng.
    Trong nhóm đã được gán trợ lý, bật quyền lần lượt cho 4, 10 và 20 người theo thứ tự chốt trước.
    Hai bước đầu chỉ dùng để kiểm tra vận hành. Khi so an toàn ở hai bước này, so nhân viên đã
    bật quyền với 20 nhân viên đối chứng cùng thời điểm. Những người đang chờ bật quyền vẫn thuộc nhóm trợ lý.
    Bắt đầu thu dữ liệu phân tích chính khi đủ 20 nhân viên trợ lý và 20 đối chứng.
    Giữ mức 50% đến khi mỗi nhân viên đạt 299 yêu cầu đủ điều kiện và đã theo dõi đủ 7 ngày.
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96
    clusters_per_arm: 20
    min_requests_per_staff: 299
    raw_requests_per_arm: 5980
    analysis: >-
      Mẫu số là mọi yêu cầu đủ điều kiện của nhân viên theo nhóm đã gán, kể cả khi không mở trợ lý.
      So sánh tỉ lệ theo chênh lệch tuyệt đối, có điều chỉnh depot và sai số theo cụm nhân viên.
      Chỉ đề xuất mở rộng khi đủ mẫu, chênh quan sát ít nhất +6 điểm %, cận dưới khoảng tin cậy
      hai phía 95% lớn hơn 0, và đạt mọi điều kiện an toàn, chi phí và sử dụng.
  identifiability:
    concurrent_control: true
    spillover_risk: "Không chia sẻ gợi ý giữa hai nhóm. Khóa quyền theo tài khoản và rà log theo staff_id hằng tuần."
    predeclared: true
  stop_rules:
    - >-
      NẾU tỷ lệ mở lại 7 ngày của nhóm trợ lý vượt 6% hoặc cao hơn đối chứng từ 2 điểm %
      TRONG 3 lần rà hằng ngày liên tiếp trên các yêu cầu của cả hai nhóm đã đủ 7 ngày theo dõi
      THÌ Giám đốc vận hành tắt trợ lý trong 30 phút và chuyển về luồng nhân viên
      KHÔNG THÌ giữ theo lịch, chỉ tăng bước sau khi đã có đủ ba lần rà không vượt ngưỡng.
    - >-
      NẾU phát hiện ít nhất 1 giao dịch hoàn trùng đã xác nhận TRONG bất kỳ ca trực nào
      THÌ Giám đốc vận hành tắt trợ lý trong 30 phút và yêu cầu đối soát sổ cái
      KHÔNG THÌ tiếp tục giám sát giao dịch theo thời gian thực.
    - >-
      NẾU chi phí biến đổi mỗi việc thành công vượt 8.000 đ TRONG 2 tuần liên tiếp
      THÌ Giám đốc vận hành dừng đợt đo trong 1 ngày làm việc, yêu cầu PM chỉnh phạm vi và trình lại thiết kế
      KHÔNG THÌ giữ phạm vi và tiếp tục theo dõi chi phí hằng tuần.
    - >-
      NẾU tỷ lệ gợi ý bị sửa hoặc bỏ vượt 40% trên các yêu cầu đã xem lại TRONG 1 tuần
      THÌ trong 1 ngày làm việc Giám đốc vận hành quyết định giữ nguyên mức triển khai, giao Trưởng nhóm CSKH
      phỏng vấn 5 nhân viên trong 3 ngày và chỉ cho tăng bước sau khi đã rà soát nguyên nhân
      KHÔNG THÌ tiếp tục theo lịch nếu đã đạt các điều kiện an toàn.
  interim_looks: "Rà an toàn hằng ngày và chi phí, sử dụng hằng tuần để thực thi luật dừng. Chỉ phân tích chỉ số chính khi chốt dữ liệu."
  rollback: >-
    Giám đốc vận hành tắt cờ trợ lý, hiệu lực trong 30 phút. CSKH tiếp quản qua luồng nhân viên,
    đối soát các lệnh hoàn đang chờ để tránh ghi trùng. Chỉ bật lại sau khi nguyên nhân được xử lý và duyệt.
  decision_date: "2027-01-19"
  decision_if_incomplete: "Nếu đến ngày dự kiến còn thiếu mẫu hoặc chưa đủ 7 ngày theo dõi, giữ nguyên phạm vi và chốt lại ngày quyết định trước khi đọc chỉ số chính."
  simulated_inputs:
    - "Chi phí biến đổi A3 [simulated]: noi_dia 2.696 đ, hang_nang 8.221 đ, quoc_te 22.515 đ, doi_tac 10.215 đ mỗi việc thành công."
    - "Tỷ lệ mở lại [simulated]: 51/1.200 toàn mẫu và 39/982 trong phạm vi."
